services:
  awtrix2:
    image: registry.example.com/your-namespace/awtrix2:latest
    container_name: sam-awtrix2
    ports:
      - "7000:7000" # TCP：網頁管理介面與 HTTP API
      - "7001:7001" # TCP：Matrix Port，實體 AWTRIX 時鐘連接伺服器
      - "5568:5568/udp" # UDP：E1.31／sACN 燈光控制資料
    restart: unless-stopped
    mem_limit: 1283457024
    environment:
      TZ: Asia/Taipei
    volumes:
      - type: bind
        # Confirm the actual NAS volume number in File Station.
        source: /volume1/docker/your-awtrix2-data
        target: /data
        bind:
          create_host_path: false
